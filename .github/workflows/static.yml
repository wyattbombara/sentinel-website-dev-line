# This independent development line validates changes; it never deploys Pages.
name: Validate Sentinel development line
on:
  push:
    branches: [main, 'redesign/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Retain browser review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-browser-review
          path: test-results/
